      // Stamp the document locale before the bundle loads, so /he never paints
      // an English left-to-right frame first. React (via Helmet) sets the same
      // attributes once it mounts; this only moves the decision earlier, and
      // resolves to the existing lang="en" / dir="ltr" for every English route
      // (OYS-383).
      (function () {
        var isHebrew = /^\/he(\/|$)/.test(window.location.pathname);
        document.documentElement.lang = isHebrew ? 'he' : 'en';
        document.documentElement.dir = isHebrew ? 'rtl' : 'ltr';
      })();

    <script data-theme-boot>
      // Apply a dark theme before first paint, so prerendered pages never flash
      // light first (OYS-426). Light is the absence of data-theme, so light
      // visitors get an untouched DOM. With no stored choice the OS setting
      // decides (FOLLOW_SYSTEM, on since OYS-428). STORAGE_KEY, FOLLOW_SYSTEM and
      // the theme-color value mirror src/utils/theme.js — a test fails if they drift.
      (function () {
        var STORAGE_KEY = 'theme';
        var FOLLOW_SYSTEM = true;
        var stored = null;
        try {
          stored = window.localStorage.getItem(STORAGE_KEY);
        } catch (e) {
          // Storage blocked (private mode, site data off): use the default.
        }
        var dark = stored === 'dark' || (stored !== 'light' && FOLLOW_SYSTEM
          && typeof window.matchMedia === 'function'
          && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.setAttribute('data-theme', 'dark');
          // Browser UI colour: --bg in dark (THEME_COLORS.dark in theme.js).
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#09090B');
        }
      })();
